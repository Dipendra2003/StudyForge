# =============================================================================
# StudyForge — Nginx Server Block
# =============================================================================
# Proxies all requests to the Node.js application container.
# Static assets are served directly by Express (built into dist/public).
# =============================================================================

upstream studyforge_app {
    server app:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # HTTPS Configuration
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Redirect HTTP to HTTPS:
    if ($scheme != "https") {
        return 301 https://$host$request_uri;
    }

    # Health check endpoint (no rate limit, no logging)
    location = /api/health {
        proxy_pass http://studyforge_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # API routes — proxy to Node.js with rate limiting
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://studyforge_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts for long-running AI requests
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;

        # Buffering for large AI responses
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }

    # WebSocket support (for Vite HMR in dev, or real-time features)
    location /ws {
        proxy_pass http://studyforge_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # All other routes — proxy to Node.js (serves React SPA)
    location / {
        proxy_pass http://studyforge_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Block access to sensitive files
    location ~ /\. {
        deny all;
        return 404;
    }
}
